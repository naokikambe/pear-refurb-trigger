name: External Trigger Stub

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  repository_dispatch:
    types:
      - external_tick
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Log trigger metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          ACTOR: ${{ github.actor }}
          PAYLOAD_SOURCE: ${{ github.event.client_payload.source }}
          PAYLOAD_SENT_AT: ${{ github.event.client_payload.sent_at }}
        run: |
          case "${EVENT_NAME}" in
            schedule)
              trigger_source="github-schedule"
              ;;
            repository_dispatch)
              trigger_source="external-dispatch"
              ;;
            workflow_dispatch)
              trigger_source="manual"
              ;;
            *)
              trigger_source="unknown"
              ;;
          esac

          echo "UTC timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "JST timestamp: $(TZ=Asia/Tokyo date +"%Y-%m-%dT%H:%M:%S%z")"
          echo "event name: ${EVENT_NAME}"
          echo "event action: ${EVENT_ACTION:-none}"
          echo "trigger_source=${trigger_source}"
          echo "run id: ${RUN_ID}"
          echo "run number: ${RUN_NUMBER}"
          echo "actor: ${ACTOR}"
          echo "client_payload.source: ${PAYLOAD_SOURCE:-none}"
          echo "client_payload.sent_at: ${PAYLOAD_SENT_AT:-none}"

      - name: Dispatch watcher workflow
        env:
          EVENT_NAME: ${{ github.event_name }}
          WATCHER_DISPATCH_TOKEN: ${{ secrets.WATCHER_DISPATCH_TOKEN }}
          WATCHER_REPO: ${{ vars.WATCHER_REPO }}
          WATCHER_WORKFLOW: ${{ vars.WATCHER_WORKFLOW }}
          WATCHER_REF: ${{ vars.WATCHER_REF }}
        run: |
          set -euo pipefail

          case "${EVENT_NAME}" in
            schedule)
              trigger_source="github-schedule"
              ;;
            repository_dispatch)
              trigger_source="external-dispatch"
              ;;
            workflow_dispatch)
              trigger_source="manual"
              ;;
            *)
              trigger_source="unknown"
              ;;
          esac

          : "${WATCHER_DISPATCH_TOKEN:?WATCHER_DISPATCH_TOKEN is required}"
          : "${WATCHER_REPO:?WATCHER_REPO is required}"
          : "${WATCHER_WORKFLOW:?WATCHER_WORKFLOW is required}"
          : "${WATCHER_REF:?WATCHER_REF is required}"

          echo "watcher repo: ${WATCHER_REPO}"
          echo "watcher workflow: ${WATCHER_WORKFLOW}"
          echo "trigger_source=${trigger_source}"

          request_body="$(mktemp)"
          python3 -c 'import json, sys; print(json.dumps({"ref": sys.argv[1], "inputs": {"trigger_source": sys.argv[2]}}))' \
            "$WATCHER_REF" "$trigger_source" > "$request_body"

          status="$(
            curl -sS -o /dev/null -w "%{http_code}" \
              -X POST \
              --oauth2-bearer "${WATCHER_DISPATCH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${WATCHER_REPO}/actions/workflows/${WATCHER_WORKFLOW}/dispatches" \
              -d @"$request_body"
          )"
          rm -f "$request_body"

          echo "watcher dispatch HTTP status: ${status}"
          test "$status" = "204"
